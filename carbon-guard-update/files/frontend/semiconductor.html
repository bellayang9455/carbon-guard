<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/icon.svg"><link rel="stylesheet" href="/assets/style.css"><title>碳鏈 CarbonGuard</title></head><body>
<section id="login-view" class="login"><form id="login-form" class="card"><div class="eyebrow">CARBONGUARD</div><h1>碳排放資料管理</h1><label>帳號<input name="username" autocomplete="username" required maxlength="80"></label><label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登入</button><p id="login-error" role="alert"></p></form></section>
<div id="app" hidden><aside><div class="brand">◈ 碳鏈<small>CARBONGUARD</small></div><nav><button data-page="records">資料管理</button><button data-page="models" class="admin-only" hidden>模型管理</button><button data-page="integrity" class="admin-only" hidden>完整性驗證</button><button data-page="settings" class="admin-only" hidden>管理設定</button></nav><div id="identity"></div><button id="logout" class="secondary">登出</button></aside><main><div class="heading"><h1 id="page-title">資料管理</h1><div id="data-actions"><button id="add-record">＋ 新增資料</button><button id="import-data" class="secondary">匯入 CSV</button></div></div><div id="period-tabs" class="period-tabs" role="group" aria-label="資料類型"><button data-period="annual">半導體年度</button><button data-period="monthly">月份資料</button></div><section id="content"></section></main></div>
<dialog id="modal"><div class="heading"><h2 id="modal-title"></h2><button id="modal-close" class="secondary" type="button">關閉</button></div><div id="modal-content"></div><p id="modal-error" role="alert"></p></dialog><div id="toast" role="status" hidden></div><script src="/assets/app.js"></script></body></html>
