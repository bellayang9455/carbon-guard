<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/icon.svg"><title>碳鏈 CarbonGuard</title><link rel="stylesheet" href="/assets/style.css"></head>
<body>
<section id="login-view" class="login"><form id="login-form" class="card"><div class="eyebrow">CARBONGUARD</div><h1>供應鏈碳數據安全平台</h1><p>登入以管理排放資料、偵測異常與驗證完整性。</p><label>帳號<input name="username" autocomplete="username" maxlength="80" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button>登入</button><p id="login-error" role="alert"></p><small>請先依 README 建立帳號。系統沒有預設密碼。</small></form></section>
<div id="app" hidden><aside><div class="brand">◈ 碳鏈 <small>CARBONGUARD</small></div><nav><a class="annual-link" href="/semiconductor">半導體年度模型 ↗</a><button data-page="overview">總覽儀表板</button><button data-page="records">碳排放資料</button><button data-page="ai">AI 異常偵測</button><button data-page="integrity" class="admin-only">資料完整性</button><button data-page="security" class="admin-only">資安與稽核</button></nav><div id="identity"></div><button id="logout" class="secondary">登出</button></aside><main><div class="heading"><div><div class="eyebrow">SUPPLY CHAIN INTELLIGENCE</div><h1 id="page-title"></h1><p>SHA-256 / HMAC 完整性驗證 × Isolation Forest 異常偵測</p></div><button id="open-upload">＋ 新增排放資料</button></div><div id="model-banner" class="notice" hidden></div><section id="content"></section><footer>排放量統一使用 tCO₂e，產量需採可比較的相同單位。異常結果需要人工覆核。</footer></main></div>
<dialog id="upload-dialog"><form id="record-form"><div class="heading"><h2>新增碳排放資料</h2><button type="button" id="close-dialog" class="secondary">關閉</button></div><label>供應商<input name="supplier" maxlength="100" required></label><div class="grid two"><label>盤查月份<input name="month" type="month" required></label><label>排放範疇<select name="scope"><option value="1">範疇一</option><option value="2">範疇二</option><option value="3">範疇三</option></select></label><label>排放量 (tCO₂e)<input name="emission" type="number" min="0" max="1000000000000" step="any" required></label><label>產量 (統一單位)<input name="production" type="number" min="0.001" max="1000000000000" step="any" required></label></div><button>儲存並評分</button><p>或匯入 CSV（2 MB 以內，每批最多 1,000 筆）</p><input id="upload-csv" type="file" accept=".csv,text/csv" aria-label="匯入 CSV"><small>欄位順序：supplier,month,scope,emission,production</small><p id="upload-message" role="alert"></p></form></dialog>
<div id="toast" role="status" hidden></div><script src="/assets/app.js"></script></body></html>
